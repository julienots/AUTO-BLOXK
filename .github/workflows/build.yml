name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # On liste explicitement les packages nécessaires : le package
          # "tools" (déprécié, retiré du dépôt Google) n'est PAS demandé,
          # ce qui évite l'échec de sdkmanager.
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Generer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Rendre gradlew executable
        run: chmod +x ./gradlew

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: blockauto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
